name: flutter_localization_example
description: "Demonstrates how to use the flutter_localization plugin."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localization:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Localization JSON assets used by the example application.
  assets:
    - assets/i18n/en.json
    - assets/i18n/km.json
    - assets/i18n/ja.json